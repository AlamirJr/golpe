<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0f1f" />
  <title>Acesso Restrito</title>

  <style>
    :root {
      --bg-1: #07111f;
      --bg-2: #0c1b34;
      --card: rgba(16, 27, 49, 0.72);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f7f9fc;
      --muted: #aebbd0;
      --primary: #4f8df7;
      --primary-2: #6aa7ff;
      --danger: #ff9a9a;
      --success: #9be7b3;
      --shadow: 0 25px 70px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(65, 124, 255, 0.24), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(80, 58, 180, 0.22), transparent 32%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      overflow: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(12px);
      opacity: .55;
      pointer-events: none;
    }

    body::before {
      width: 320px;
      height: 320px;
      background: rgba(61, 121, 255, 0.17);
      top: -90px;
      right: -90px;
    }

    body::after {
      width: 260px;
      height: 260px;
      background: rgba(122, 83, 255, 0.12);
      bottom: -80px;
      left: -70px;
    }

    .shell {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
      animation: appear .55s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 42px 34px 30px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)),
        var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(255,255,255,.05),
        transparent 35%,
        transparent 65%,
        rgba(255,255,255,.025)
      );
      pointer-events: none;
    }

    .top-line {
      width: 72px;
      height: 4px;
      margin: 0 auto 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), #7b61ff);
      box-shadow: 0 0 20px rgba(79, 141, 247, .45);
    }

    .lock-wrap {
      width: 84px;
      height: 84px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.12);
      background:
        linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 14px 32px rgba(0,0,0,.22);
    }

    .lock-icon {
      width: 38px;
      height: 38px;
      display: block;
    }

    .eyebrow {
      margin-bottom: 8px;
      text-align: center;
      color: #86aaf0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      text-align: center;
      font-size: clamp(27px, 6vw, 34px);
      line-height: 1.1;
      letter-spacing: -.03em;
      margin-bottom: 12px;
    }

    .subtitle {
      max-width: 360px;
      margin: 0 auto 28px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .field-label {
      display: block;
      margin: 0 0 9px 2px;
      color: #dbe4f3;
      font-size: 13px;
      font-weight: 650;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      height: 56px;
      padding: 0 52px 0 17px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 15px;
      outline: none;
      background: rgba(255,255,255,.055);
      color: var(--text);
      font-size: 16px;
      transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    input::placeholder {
      color: #7f90aa;
    }

    input:hover {
      background: rgba(255,255,255,.07);
    }

    input:focus {
      border-color: rgba(106, 167, 255, .9);
      background: rgba(255,255,255,.075);
      box-shadow: 0 0 0 4px rgba(79, 141, 247, .13);
    }

    .toggle {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #b9c6d8;
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }

    .toggle:hover {
      background: rgba(255,255,255,.07);
      color: #fff;
    }

    .enter {
      width: 100%;
      height: 56px;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
      color: #fff;
      font-size: 16px;
      font-weight: 750;
      letter-spacing: .01em;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 14px 30px rgba(48, 110, 230, .27);
      transition:
        transform .16s ease,
        filter .16s ease,
        box-shadow .16s ease;
    }

    .enter:hover {
      filter: brightness(1.06);
      box-shadow: 0 18px 34px rgba(48, 110, 230, .34);
      transform: translateY(-1px);
    }

    .enter:active {
      transform: translateY(0) scale(.99);
    }

    #message {
      min-height: 24px;
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
      color: var(--danger);
    }

    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      color: #8090a7;
      font-size: 12px;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: rgba(255,255,255,.38);
      font-size: 11px;
      letter-spacing: .02em;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
        overflow: auto;
      }

      .card {
        padding: 34px 22px 26px;
        border-radius: 24px;
      }

      .lock-wrap {
        width: 76px;
        height: 76px;
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <main class="card">
      <div class="top-line"></div>

      <div class="lock-wrap" aria-hidden="true">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none">
          <path d="M7 10V8a5 5 0 0 1 10 0v2"
                stroke="#78A7FF"
                stroke-width="1.8"
                stroke-linecap="round"/>
          <rect x="5" y="10" width="14" height="10" rx="3"
                stroke="#F4F7FF"
                stroke-width="1.8"/>
          <circle cx="12" cy="15" r="1.3" fill="#78A7FF"/>
        </svg>
      </div>

      <div class="eyebrow">Acesso protegido</div>
      <h1>Área Restrita</h1>

      <p class="subtitle">
        Informe sua senha para acessar com segurança os arquivos compartilhados.
      </p>

      <form id="loginForm">
        <label class="field-label" for="password">Senha de acesso</label>

        <div class="input-wrap">
          <input
            id="password"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            autofocus
            required
          />

          <button
            class="toggle"
            type="button"
            id="togglePassword"
            aria-label="Mostrar ou ocultar senha"
            title="Mostrar ou ocultar senha"
          >
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"
                    stroke="currentColor"
                    stroke-width="1.6"/>
              <circle cx="12" cy="12" r="2.5"
                      stroke="currentColor"
                      stroke-width="1.6"/>
            </svg>
          </button>
        </div>

        <button class="enter" type="submit">
          Acessar arquivos
        </button>

        <div id="message" aria-live="polite"></div>
      </form>

      <div class="security-note">
        <span aria-hidden="true">🔐</span>
        <span>Acesso reservado a usuários autorizados</span>
      </div>
    </main>

    <div class="footer">
      Conteúdo protegido por senha
    </div>
  </div>

  <script>
    const DRIVE_URL =
      "https://drive.google.com/drive/folders/1XTX6AjKUc64C6SIOP4da1yVuUWB3GpHR";

    const ACCESS_PASSWORD = "Acesso2026";

    const form = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
      passwordInput.type =
        passwordInput.type === "password" ? "text" : "password";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (passwordInput.value === ACCESS_PASSWORD) {
        message.style.color = "#9BE7B3";
        message.textContent = "Senha correta. Abrindo os arquivos...";

        setTimeout(() => {
          window.location.href = DRIVE_URL;
        }, 550);
      } else {
        message.style.color = "#FF9A9A";
        message.textContent = "Senha incorreta. Verifique e tente novamente.";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
