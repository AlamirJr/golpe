<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Protegido</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b, #334155);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    text-align: center;
  }
  .icon {
    font-size: 42px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 20px;
    color: #1e293b;
    margin-bottom: 8px;
  }
  p.desc {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 24px;
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="password"]:focus {
    border-color: #3b82f6;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover {
    background: #2563eb;
  }
  #error {
    color: #dc2626;
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
  }
  #downloadArea {
    display: none;
    margin-top: 16px;
    text-align: left;
  }
  .aviso {
    background: #fef3c7;
    color: #92400e;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
    text-align: left;
  }
  .aviso a {
    color: #92400e;
    font-weight: 600;
  }
  .parte {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #f1f5f9;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .parte a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
  }
  .parte a:hover {
    text-decoration: underline;
  }
  #downloadArea .instrucoes {
    display: block;
    text-align: center;
    margin-top: 14px;
    padding: 10px;
    background: #16a34a;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
  }
  #downloadArea .instrucoes:hover {
    background: #15803d;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">🔒</div>
  <h1>Área de Download Protegida</h1>
  <p class="desc">Digite a senha de acesso para liberar o download do arquivo.</p>

  <div id="loginArea">
    <input type="password" id="pwd" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter') checarSenha()">
    <button onclick="checarSenha()">Acessar</button>
    <div id="error"></div>
  </div>

  <div id="downloadArea">
    <div class="aviso">
      ⚠️ O arquivo foi dividido em <strong>7 partes</strong> (máx. 24MB cada). Baixe todas e junte-as seguindo o <a href="LEIA-ME.txt" target="_blank">LEIA-ME.txt</a>.
    </div>
    <div id="listaPartes"></div>
    <a class="instrucoes" href="LEIA-ME.txt" target="_blank">📄 Ver instruções (LEIA-ME.txt)</a>
  </div>
</div>

<script>
  // --- CONFIGURAÇÃO ---
  // Nomes das partes do arquivo .zip (devem estar na MESMA pasta deste HTML no GitHub Pages)
  const PARTES = [
    "Conversa_do_WhatsApp_com_Golpe.zip.00.part",
    "Conversa_do_WhatsApp_com_Golpe.zip.01.part",
    "Conversa_do_WhatsApp_com_Golpe.zip.02.part",
    "Conversa_do_WhatsApp_com_Golpe.zip.03.part",
    "Conversa_do_WhatsApp_com_Golpe.zip.04.part",
    "Conversa_do_WhatsApp_com_Golpe.zip.05.part",
    "Conversa_do_WhatsApp_com_Golpe.zip.06.part"
  ];

  // Senha de acesso (troque pelo valor desejado)
  const SENHA = "golpe123";
  // ---------------------

  function montarListaPartes() {
    const lista = document.getElementById("listaPartes");
    lista.innerHTML = "";
    PARTES.forEach((nome, i) => {
      const item = document.createElement("div");
      item.className = "parte";
      item.innerHTML = `<span>Parte ${String(i + 1).padStart(2, "0")}/${PARTES.length}</span>
        <a href="${nome}" download>⬇️ Baixar</a>`;
      lista.appendChild(item);
    });
  }

  function checarSenha() {
    const input = document.getElementById("pwd").value;
    const erro = document.getElementById("error");

    if (input === SENHA) {
      document.getElementById("loginArea").style.display = "none";
      montarListaPartes();
      document.getElementById("downloadArea").style.display = "block";
      erro.textContent = "";
    } else {
      erro.textContent = "Senha incorreta. Tente novamente.";
      document.getElementById("pwd").value = "";
    }
  }
</script>

</body>
</html>
